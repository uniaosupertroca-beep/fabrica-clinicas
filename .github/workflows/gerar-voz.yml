# Gera a narração dos vídeos em videos/<nome>/roteiro.json com vozes neurais (rodam aqui porque precisam
# baixar os modelos), compara as vozes e grava os áudios de volta no repositório.
name: Gerar voz dos vídeos

on:
  push:
    branches: [main]
    paths: ["videos/*/roteiro.json"]
  workflow_dispatch:
    inputs:
      video:
        description: "Pasta em videos/"
        default: demo-sistema
      motores:
        description: "Motores separados por vírgula (vazio = todos): kokoro,xtts,xtts-ref,chatterbox"
        default: ""
      cenas:
        description: "Só regerar estas cenas (ids separados por vírgula; vazio = todas)"
        default: ""

concurrency:
  group: gerar-voz
  cancel-in-progress: false

env:
  VIDEO: ${{ inputs.video || 'demo-sistema' }}
  COQUI_TOS_AGREED: "1"
  CENAS: ${{ inputs.cenas }}
  PIP_TORCH: torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu

jobs:
  kokoro:
    if: ${{ !inputs.motores || contains(format(',{0},', inputs.motores), ',kokoro,') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng
      - run: pip install $PIP_TORCH && pip install kokoro soundfile faster-whisper librosa
      - run: python videos/gerar_voz.py videos/$VIDEO --motor kokoro ${CENAS:+--cenas "$CENAS"}
      - name: Trecho de referência para as vozes clonadas
        run: |
          python - <<'PY'
          import os, soundfile as sf
          base = f"videos/{os.environ['VIDEO']}/voz/kokoro"
          audio, taxa = sf.read(f"{base}/cena-01-abertura.wav")
          sf.write(f"{base}/referencia.wav", audio[: taxa * 12], taxa)
          PY
      - uses: actions/upload-artifact@v4
        with: { name: voz-kokoro, path: "videos/${{ env.VIDEO }}/voz/kokoro" }

  xtts:
    if: ${{ !inputs.motores || contains(format(',{0},', inputs.motores), ',xtts,') }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install $PIP_TORCH && pip install coqui-tts "transformers>=4.57,<5" faster-whisper librosa soundfile
      - run: python videos/gerar_voz.py videos/$VIDEO --motor xtts ${CENAS:+--cenas "$CENAS"}
      - uses: actions/upload-artifact@v4
        with: { name: voz-xtts, path: "videos/${{ env.VIDEO }}/voz/xtts" }

  clonadas:
    needs: kokoro
    # Roda mesmo sem o Kokoro nesta execução: a referência pode vir da narração já gravada no repositório.
    if: ${{ always() && (!inputs.motores || contains(inputs.motores, 'xtts-ref') || contains(inputs.motores, 'chatterbox')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        motor: [xtts-ref, chatterbox]
    env:
      MOTORES: ${{ inputs.motores }}
    steps:
      - name: Este motor foi pedido?
        run: |
          if [ -z "$MOTORES" ] || [[ ",$MOTORES," == *",${{ matrix.motor }},"* ]]; then echo "RODAR=sim" >> $GITHUB_ENV; else echo "RODAR=nao" >> $GITHUB_ENV; fi
      - uses: actions/checkout@v4
        if: env.RODAR == 'sim'
      - uses: actions/setup-python@v5
        if: env.RODAR == 'sim'
        with: { python-version: "3.11" }
      - uses: actions/download-artifact@v4
        if: env.RODAR == 'sim'
        continue-on-error: true
        with: { name: voz-kokoro, path: ref }
      - name: Trecho de referência
        if: env.RODAR == 'sim'
        run: |
          REF=ref/referencia.wav
          [ -f "$REF" ] || REF=videos/$VIDEO/voz/kokoro/referencia.wav
          ls -la "$REF" && echo "REF=$REF" >> $GITHUB_ENV
      - if: env.RODAR == 'sim' && matrix.motor == 'xtts-ref'
        run: pip install $PIP_TORCH && pip install coqui-tts "transformers>=4.57,<5" faster-whisper librosa soundfile
      - if: env.RODAR == 'sim' && matrix.motor == 'chatterbox'
        run: pip install $PIP_TORCH && pip install chatterbox-tts faster-whisper soundfile
      - if: env.RODAR == 'sim'
        run: python videos/gerar_voz.py videos/$VIDEO --motor ${{ matrix.motor }} --referencia "$REF" ${CENAS:+--cenas "$CENAS"}
      - uses: actions/upload-artifact@v4
        if: env.RODAR == 'sim'
        with: { name: "voz-${{ matrix.motor }}", path: "videos/${{ env.VIDEO }}/voz/${{ matrix.motor }}" }

  avaliar:
    needs: [kokoro, xtts, clonadas]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/download-artifact@v4
        with: { pattern: "voz-*", path: baixadas }
      - name: Juntar as vozes geradas
        run: |
          mkdir -p videos/$VIDEO/voz
          for d in baixadas/voz-*; do
            [ -f "$d/resumo.json" ] || continue
            m=${d#baixadas/voz-}
            rm -rf "videos/$VIDEO/voz/$m" && cp -r "$d" "videos/$VIDEO/voz/$m"
          done
          ls -R videos/$VIDEO/voz
      - run: pip install $PIP_TORCH && pip install soundfile numpy
      - run: python videos/avaliar_voz.py videos/$VIDEO
      - name: Gravar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos/$VIDEO/voz
          git diff --cached --quiet && exit 0
          git commit -m "Narração gerada: videos/$VIDEO"
          for i in 1 2 3 4; do git pull --rebase origin main && git push origin HEAD:main && break; sleep $((i * 5)); done
