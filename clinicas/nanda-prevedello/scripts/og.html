<!doctype html>
<!-- Arte da prévia de link (WhatsApp, Instagram, Google): 1200x630. Gerada por scripts/gerar-imagens.mjs. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:"Marcellus";src:url("../node_modules/@fontsource/marcellus/files/marcellus-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Figtree";src:url("../node_modules/@fontsource-variable/figtree/files/figtree-latin-wght-normal.woff2") format("woff2");font-weight:300 900}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px}
body{font-family:Figtree,sans-serif;background:#141011;color:#f6eee8;position:relative;overflow:hidden}
.luz{position:absolute;inset:0;background:radial-gradient(40% 60% at 80% 45%,rgba(201,164,101,.28),transparent 70%),linear-gradient(180deg,#141011,#1f191a)}
.conteudo{position:absolute;left:80px;top:74px;width:640px}
.chapeu{display:flex;align-items:center;gap:14px;font-family:Marcellus,serif;font-size:22px;color:#c9a465}
.chapeu:before{content:"";width:36px;height:1px;background:#c9a465}
h1{margin-top:26px;font-family:Marcellus,serif;font-weight:400;font-size:104px;line-height:.94;background:linear-gradient(135deg,#8a6431 0%,#e6cb8e 38%,#b58b4f 62%,#f2dfae 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:8px}
p{margin-top:26px;font-family:Marcellus,serif;font-size:31px;line-height:1.25;max-width:15em}
small{display:block;margin-top:30px;padding-top:22px;border-top:1px solid rgba(201,164,101,.3);font-size:21px;color:#c4b6af}
.logo{position:absolute;right:88px;top:50%;translate:0 -50%;width:300px}
</style>
</head>
<body>
<div class="luz"></div>
<div class="conteudo">
  <div class="chapeu">Estética avançada em Balneário Camboriú</div>
  <h1>Nanda<br>Prevedello</h1>
  <p>Harmonização íntima e corporal, com ciência e discrição.</p>
  <small>Biomédica, CRBM 64579</small>
</div>
<img class="logo" src="../public/logo-nanda.svg" alt="">
</body>
</html>
